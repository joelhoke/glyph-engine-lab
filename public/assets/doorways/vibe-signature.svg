      <stop offset="0" stop-color="#0d0a14"/>
      <stop offset="1" stop-color="#1a1026"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="0.2" stop-color="#ff8800"/>
