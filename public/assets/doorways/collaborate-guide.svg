<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Collaborate — a typographic card inviting conversation with Joel or his AI guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100a0a"/>
      <stop offset="1" stop-color="#201410"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g font-family="'Cutive Mono', ui-monospace, monospace" font-size="13" opacity="0.55">
    <text x="24" y="52" fill="#d68a5a">say hello · ask anything · say hello · ask anything · say</text>
    <text x="24" y="360" fill="#d68a5a">ask anything · say hello · ask anything · say hello · ask</text>
  </g>
  <text x="300" y="178" text-anchor="middle" font-family="'Cutive Mono', ui-monospace, monospace" font-size="26" letter-spacing="2" fill="#fff0e6">what did he ship</text>
  <text x="300" y="212" text-anchor="middle" font-family="'Cutive Mono', ui-monospace, monospace" font-size="26" letter-spacing="2" fill="#fff0e6">at microsoft?</text>
  <text x="300" y="262" text-anchor="middle" font-family="'Cutive Mono', ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#f2b28a">ask the guide →</text>
</svg>
