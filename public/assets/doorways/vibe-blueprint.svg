<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Vibe playground in the Blueprint theme — blue monospace glyph field with drafting marks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g stroke="#224f7a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>
  <g font-family="'Courier New', ui-monospace, monospace" font-size="13">
    <text x="24" y="60" fill="#8abaff">draft · draw · measure · make · draft · draw · measure ·</text>
    <text x="24" y="140" fill="#5a8fd6">draw · measure · make · draft · draw · measure · make ·</text>
    <text x="24" y="180" fill="#bcd7ff" opacity="0.8">measure · make · draft · draw · measure · make · draft ·</text>
    <text x="24" y="260" fill="#bcd7ff" opacity="0.8">make · draft · draw · measure · make · draft · draw ·</text>
    <text x="24" y="340" fill="#8abaff">draft · draw · measure · make · draft · draw · measure ·</text>
  </g>
  <text x="300" y="216" text-anchor="middle" font-family="'Courier New', ui-monospace, monospace" font-size="32" letter-spacing="6" fill="#dbe9ff">draft</text>
</svg>
