# Daily retention sweep; Pages binds these same databases in root wrangler.toml.
name = "collaborate-cleanup"
main = "src/index.ts"
compatibility_date = "2026-09-21"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "COLLABORATE_DB"
database_name = "jh-collaborate"
database_id = "f8ae9831-5054-4205-b71c-65d2940392d8"

[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "jh-feedback"
database_id = "905fb971-24d8-4867-85fa-92634e56a3ab"

[observability]
enabled = true

[triggers]
crons = ["17 4 * * *"]
