# Cloudflare Pages project configuration (M9 launch hardening).
#
# The site remains a fully static export (`output: 'export'` in next.config.js
# → `npm run build` emits out/). Pages serves out/ verbatim; Pages Functions in
# functions/ handle the confidential API separately and never participate in
# the public static routes.
#
# Deploys run from the Cloudflare dashboard or an authenticated wrangler
# session (see docs/deployment.md). Nothing here changes the local build.

name = "glyph-engine-lab"
pages_build_output_dir = "out"

# Non-secret configuration for the collaborate AI guide (see docs/deployment.md,
# "Collaborate AI guide"). The dashboard manages ONLY secrets for this project
# (AIG_TOKEN, OPENAI_API_KEY, DEEPSEEK_API_KEY) — never put those here.
[vars]
CF_ACCOUNT_ID = "42cf2d6bb1238015365cb8aa5cbeb251"
AIG_GATEWAY_ID = "jh-guide"
# Kimi goes direct to Moonshot's OpenAI-compatible API for launch: this
# gateway has no native moonshot provider (400 "Invalid provider" via compat).
# Revisit a gateway Custom Provider later to bring Kimi traffic under the
# gateway's spend limit and observability (see docs/deployment.md).
AIG_MOONSHOT_URL = "https://api.moonshot.ai/v1/chat/completions"
MOONSHOT_MODEL = "kimi-k2.6"

# R2 binding for the confidential-work Pages Functions (Stage 4b). Bind the
# private bucket in the Pages dashboard (Settings → Functions → R2 bucket
# bindings) as PROTECTED_BUCKET — dashboard bindings are the source of truth.
# Also set ACCESS_TEAM_DOMAIN and ACCESS_AUD as project environment variables.
# See docs/deployment.md, "Confidential work".
#
# [[r2_buckets]]
# binding = "PROTECTED_BUCKET"
# bucket_name = "jh-protected-work"

# R2 binding for hosted prototypes (docs/prototypes-plan.md). The bucket was
# created once with:
#   wrangler r2 bucket create jh-prototypes
# The binding is declared HERE because this project's dashboard bindings are
# locked to wrangler.toml ("Bindings for this project are being managed
# through wrangler.toml") — it takes effect on the next deployment. Bundles
# are uploaded under /<stack>/<slug>/<file> with
# scripts/publish-prototypes.mjs (`wrangler r2 object put`) and served through
# functions/p/[[path]].ts; they NEVER go into public/ or the static export.
# For local dev, `wrangler pages dev` emulates R2 from this same binding (or
# pass --r2=PROTOTYPES_BUCKET on the command line).

[[r2_buckets]]
binding = "PROTOTYPES_BUCKET"
bucket_name = "jh-prototypes"
