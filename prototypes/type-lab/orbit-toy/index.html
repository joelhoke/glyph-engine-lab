<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Orbit toy</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #090c12;
        color: #8aa4c5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      .hud {
        position: fixed;
        left: 1rem;
        bottom: 0.9rem;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="field"></canvas>
    <p class="hud">orbit toy — move the pointer, click to scatter</p>
    <script>
      // Dummy prototype for the Phase 0 hosting spike: a self-contained
      // canvas sketch (no external assets) proving scripts run inside the
      // sandboxed iframe served through the /p/* Function catch-all.
      const canvas = document.getElementById('field')
      const ctx = canvas.getContext('2d')
      const pointer = { x: 0, y: 0 }
      let width = 0
      let height = 0
      let particles = []

      function resize() {
        const dpr = window.devicePixelRatio || 1
        width = window.innerWidth
        height = window.innerHeight
        canvas.width = width * dpr
        canvas.height = height * dpr
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
        pointer.x = width / 2
        pointer.y = height / 2
      }

      function spawn(count, scatter) {
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * Math.PI * 2
          const radius = 60 + Math.random() * 160
          particles.push({
            angle,
            radius,
            speed: 0.004 + Math.random() * 0.012,
            size: 1 + Math.random() * 2.5,
            vx: scatter ? (Math.random() - 0.5) * 6 : 0,
            vy: scatter ? (Math.random() - 0.5) * 6 : 0,
            hue: 200 + Math.random() * 40,
          })
        }
        // Keep the field bounded so long sessions stay light.
        if (particles.length > 420) particles = particles.slice(-420)
      }

      function tick() {
        ctx.fillStyle = 'rgba(9, 12, 18, 0.28)'
        ctx.fillRect(0, 0, width, height)
        for (const p of particles) {
          p.angle += p.speed
          const wobble = Math.sin(p.angle * 3) * 6
          const x = pointer.x + Math.cos(p.angle) * (p.radius + wobble) + p.vx
          const y = pointer.y + Math.sin(p.angle) * (p.radius + wobble) + p.vy
          ctx.beginPath()
          ctx.arc(x, y, p.size, 0, Math.PI * 2)
          ctx.fillStyle = `hsla(${p.hue}, 80%, 72%, 0.85)`
          ctx.fill()
          // Gentle decay of click-scatter velocity back into orbit.
          p.vx *= 0.96
          p.vy *= 0.96
        }
        requestAnimationFrame(tick)
      }

      window.addEventListener('resize', resize)
      window.addEventListener('pointermove', (event) => {
        pointer.x = event.clientX
        pointer.y = event.clientY
      })
      window.addEventListener('pointerdown', () => spawn(24, true))

      resize()
      spawn(140, false)
      tick()
    </script>
  </body>
</html>
